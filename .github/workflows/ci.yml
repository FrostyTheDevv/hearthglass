name: Hearthglass CI

# Workflow is configured for manual dispatch only (workflow_dispatch)
# to strictly preserve user GitHub Actions runner quota.
on:
  workflow_dispatch:

jobs:
  rust-battle-engine:
    name: Rust Convergence Duels Engine & Match Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust Battle Engine
        run: cargo build --manifest-path services/battle-server/Cargo.toml
      - name: Run Authoritative Rules Engine Tests
        run: cargo test --manifest-path services/battle-server/Cargo.toml --test rules_engine_tests
      - name: Run Multiplayer Snapshot Privacy Security Tests
        run: cargo test --manifest-path services/battle-server/Cargo.toml --test snapshot_privacy_tests
      - name: Run Comprehensive Pairwise Battle Simulation
        run: cargo test --manifest-path services/battle-server/Cargo.toml --test simulation_1000_tests -- --nocapture

  node-api-and-card-integrity:
    name: Card Catalogue Integrity, Security & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust Engine Binary for Server Bridge
        run: cargo build --manifest-path services/battle-server/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Validate 480-Card Catalogue & Starter Decks Schema
        run: node tools/card-validator/validate.mjs
      - name: Verify Card Type & Historical Baseline Integrity
        run: node tools/card-validator/verify_card_integrity.mjs
      - name: Verify Historical Integrity Regression Regimes
        run: node tools/card-validator/test_integrity_regression.mjs
      - name: Verify Canonical Keyword Vocabulary
        run: node tools/card-validator/keyword_audit.mjs
      - name: Run Economy Anti-Tamper Security Tests
        run: node services/api/tests/economy_security.test.mjs
      - name: Run Art Pipeline Raster & Review Tests
        run: node --test services/api/tests/art_pipeline_raster.test.mjs
      - name: Run Critical Authentication & Match Authorization Tests
        run: node --test services/api/tests/security_auth.test.mjs
      - name: Run Backend API & WebSocket Integration Tests
        run: node --test services/api/tests/api.test.mjs

  godot-engine-tests:
    name: Godot 4.3 Headless Smoke & Vertical Slice Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust Engine Binary for Godot Offline Bridge
        run: cargo build --manifest-path services/battle-server/Cargo.toml
      - name: Install Godot 4.3 Headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
      - name: Import Godot Project Assets (Headless - Fail Closed)
        run: godot --headless --path apps/game-client --editor --quit
      - name: Run Godot Smoke Test Suite
        run: godot --headless --path apps/game-client scenes/tests/smoke_test_runner.tscn
      - name: Run Godot Connected Vertical Slice Test
        run: godot --headless --path apps/game-client scenes/tests/vertical_slice_test.tscn
